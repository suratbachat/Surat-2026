<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surat Bachat</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6f4;margin:0;padding:0 0 40px;color:#222;overflow-x:hidden}
.top-red{background:#dc2626;color:#fff;padding:10px;text-align:center;font-weight:bold;font-size:13px;position:sticky;top:0;z-index:300}
.left-doodle{position:fixed;top:38px;bottom:0;left:0;width:210px;background:linear-gradient(180deg,#fffbeb,#fef3c7,#fde68a);border-right:4px dashed #dc2626;padding:8px;z-index:200;display:flex;flex-direction:column;text-align:center;cursor:pointer;animation:glow 1.4s infinite alternate}
@keyframes glow{0%{border-color:#dc2626}100%{border-color:#15803d}}
.d-frame{border:3px dotted #f59e0b;border-radius:16px;background:#fff;padding:10px 6px;flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.d-badge{background:#dc2626;color:#fff;font-size:11px;font-weight:900;padding:4px 10px;border-radius:12px}
.d-bigpic{width:165px;height:185px;border-radius:14px;border:3px solid #fbbf24;background:linear-gradient(145deg,#111827,#1f2937);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.d-bigpic .ico{font-size:76px;line-height:1}.d-bigpic b{color:#fbbf24;font-size:13px;margin-top:8px}
.d-catchy{font-size:15px;font-weight:900;color:#b91c1c;line-height:1.25;text-transform:uppercase}
.d-price{background:#15803d;color:#fff;font-size:12px;font-weight:bold;padding:7px;border-radius:8px;width:100%}
.right-rail{position:fixed;top:38px;bottom:0;right:0;width:76px;background:linear-gradient(180deg,#dcfce7,#fef9c3,#fee2e2);border-left:4px solid #15803d;overflow:hidden;z-index:200}
.rail-track{display:flex;flex-direction:column;gap:10px;padding:8px;animation:moveUp 14s linear infinite}
.rail-box{width:56px;height:56px;background:#fff;border-radius:12px;border:2px solid #f59e0b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px}
.rail-box span{font-size:8px;color:#111;font-weight:bold;margin-top:2px}
@keyframes moveUp{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.main{margin:14px 86px 14px 220px}
.lang-bar{display:flex;justify-content:space-between;align-items:center;background:#15803d;color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.lang-bar h2{margin:0;font-size:18px}.l-btn{background:#fff;color:#15803d;border:none;padding:5px 11px;border-radius:14px;font-weight:bold;cursor:pointer;font-size:12px}.l-btn.active{background:#facc15;color:#000}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}select,input{padding:11px;font-size:14px;border:2px solid #15803d;border-radius:10px;background:#fff}input{flex:1;min-width:160px;font-weight:bold}
.cats{margin-bottom:10px}.c-btn{background:#fff;border:1.5px solid #15803d;color:#15803d;padding:6px 12px;border-radius:18px;cursor:pointer;margin:2px;font-weight:bold;font-size:12px}.c-btn.active{background:#15803d;color:#fff}
.c-bar{font-size:13px;color:#374151;margin-bottom:10px;font-weight:bold}
.card{background:#fff;padding:14px;border-radius:14px;margin-bottom:14px;box-shadow:0 3px 8px rgba(0,0,0,0.07);border:1px solid #e5e7eb}
.c-top{display:flex;align-items:center;gap:12px;border-bottom:1px solid #f3f4f6;padding-bottom:10px;margin-bottom:10px}
.p-pic{width:66px;height:66px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:2px solid #bbf7d0;font-size:32px}
.p-pic span{font-size:8px;font-weight:bold;color:#111;margin-top:2px}.p-title{font-size:16px;font-weight:bold;display:block;margin-bottom:4px;color:#111}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:bold;background:#dcfce7;color:#15803d;margin-right:4px;display:inline-block}.t-off{background:#fee2e2;color:#dc2626}.t-bs{background:#fef08a;color:#854d0e;border:1px solid #eab308}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:6px}.st{border:1px solid #e5e7eb;padding:7px 3px;border-radius:8px;text-align:center;background:#f9fafb;font-size:12px}
.best{border:2px solid #16a34a;background:#ecfdf5;font-weight:bold;color:#15803d}.b-lbl{background:#16a34a;color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;display:inline-block;margin-bottom:2px}
.req-box{background:#fff;padding:22px;border-radius:14px;text-align:center;border:2px dashed #15803d}.req-btn{background:#15803d;color:#fff;border:none;padding:11px 20px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px;margin-top:8px}
.p-wrap{width:100%;max-width:320px;height:12px;background:#dcfce7;border-radius:10px;margin:10px auto;overflow:hidden;border:1px solid #15803d}.p-bar{height:100%;width:0%;background:#15803d;transition:width 1s linear}
</style>
</head>

  <body>
<div class="top-red" id="rBan">Sunfeast Dark Fantasy Biscuits — BUY 1 GET 1 FREE!</div>
<div class="left-doodle" onclick="jumpDeal()">
  <div class="d-frame">
    <span class="d-badge" id="dBdg">🔥 50% OFF MEGA SALE</span>
    <div class="d-bigpic"><div class="ico" id="dIco">🧴</div><b id="dBrand">BELLA VITA CEO</b></div>
    <div class="d-catchy" id="dTxt">LE LO, LE LO! SURAT KI SABSE BADI BACHAT!</div>
    <div class="d-price" id="dPrc">Reliance: Rs.425 (Save Rs.74!)</div>
  </div>
</div>
<div class="right-rail"><div class="rail-track" id="rRail"></div></div>
<div class="main">
  <div class="lang-bar">
    <h2 id="t1">Surat Bachat (Free Service)</h2>
    <div>
      <button class="l-btn active" onclick="setL('en',this)">English</button>
      <button class="l-btn" onclick="setL('hi',this)">&#2361;&#2367;&#2306;&#2342;&#2368;</button>
      <button class="l-btn" onclick="setL('gu',this)">&#2711;&#2753;&#2716;&#2736;&#2750;&#2724;&#2752;</button>
    </div>
  </div>
  <div class="row">
    <select><option>All Surat</option><option>Adajan / Pal</option><option>Vesu</option><option>Varachha</option><option>Katargam</option></select>
    <input type="text" id="sBox" placeholder="Search items or type ANY new item..." onkeyup="render()">
  </div>
  <div class="cats">
    <button class="c-btn active" onclick="setC('All',this)">All Items</button>
    <button class="c-btn" onclick="setC('Best',this)">Best Sellers</button>
    <button class="c-btn" onclick="setC('Offer',this)">Offers & Sales</button>
    <button class="c-btn" onclick="setC('Grocery',this)">Grocery & Dairy</button>
    <button class="c-btn" onclick="setC('Personal',this)">Perfume & Care</button>
    <button class="c-btn" onclick="setC('Stationery',this)">Stationery</button>
    <button class="c-btn" onclick="setC('Electronics',this)">Electronics</button>
  </div>
  <div class="c-bar" id="cBar"></div>
  <div id="out"></div>
</div>
<script src="data.js"></script>
<script>
var slides=[
  {key:"Bella Vita",bdg:"🔥 50% OFF MEGA SALE",ico:"🧴",br:"BELLA VITA CEO",txt:"LE LO, LE LO! SURAT KI SABSE BADI BACHAT!",prc:"Reliance: Rs.425 (Save Rs.74!)"},
  {key:"Dark Fantasy",bdg:"🎁 BUY 1 GET 1 FREE",ico:"🍪",br:"DARK FANTASY",txt:"EK PE EK FREE! D-MART & RELIANCE DHAMAKA!",prc:"Wallet Mart: Rs.140 Only!"},
  {key:"Aashirvaad",bdg:"🌾 RATION MEGA DEAL",ico:"🌾",br:"AASHIRVAAD ATTA",txt:"HAR MAHINE ₹2,000+ BACHAYEIN — LIVE RATES!",prc:"D-Mart: Rs.215 (Save Rs.20!)"},
  {key:"boAt",bdg:"🎧 60% OFF SALE",ico:"🎧",br:"BOAT AIRDOPES",txt:"BLINKIT SE ₹200 SASTA — ABHI CHECK KAREIN!",prc:"Reliance: Rs.1,099 Only!"}
];
var si=0;function jumpDeal(){document.getElementById("sBox").value=slides[si].key;render();}
setInterval(function(){si=(si+1)%slides.length;var s=slides[si];document.getElementById("rBan").innerText=s.br+" — "+s.txt;document.getElementById("dBdg").innerText=s.bdg;document.getElementById("dIco").innerText=s.ico;document.getElementById("dBrand").innerText=s.br;document.getElementById("dTxt").innerText=s.txt;document.getElementById("dPrc").innerText=s.prc;},3000);
var rD=[{i:"🧴",l:"PERFUME",bg:"#fef3c7"},{i:"🍪",l:"BISCUIT",bg:"#fee2e2"},{i:"🧀",l:"CHEESE",bg:"#fef9c3"},{i:"🧈",l:"BUTTER",bg:"#dcfce7"},{i:"🥛",l:"MILK",bg:"#e0f2fe"},{i:"🌾",l:"ATTA",bg:"#ffedd5"},{i:"🫙",l:"SINGTEL",bg:"#f3e8ff"},{i:"🫘",l:"DAL",bg:"#dcfce7"},{i:"☕",l:"CHAI",bg:"#fef3c7"},{i:"🍜",l:"MAGGI",bg:"#fee2e2"},{i:"🎧",l:"EARBUDS",bg:"#e0f2fe"},{i:"⌚",l:"WATCH",bg:"#f3e8ff"}];
var rh="";for(var r=0;r<24;r++){var it=rD[r%12];rh+="<div class='rail-box' style='background:"+it.bg+"'>"+it.i+"<span>"+it.l+"</span></div>";}
document.getElementById("rRail").innerHTML=rh;
var curC="All",tmr=null,db=window.SURAT_DB||[],ext=[];
try{ext=JSON.parse(localStorage.getItem("surat_v11")||"[]");}catch(e){}
db=ext.concat(db);
function setL(l,b){var bs=document.getElementsByClassName("l-btn");for(var i=0;i<bs.length;i++)bs[i].classList.remove("active");b.classList.add("active");document.getElementById("t1").innerText=l==='hi'?"\u0938\u0942\u0930\u0924 \u092c\u091a\u0924 (\u092b\u094d\u0930\u0940 \u0938\u0947\u0935\u093e)":l==='gu'?"\u0ab8\u0ac1\u0ab0\u0aa4 \u0aac\u0a9a\u0aa4 (\u0aab\u0acd\u0ab0\u0ac0 \u0ab8\u0ac7\u0ab5\u0abe)":"Surat Bachat (Free Service)";}
function setC(c,b){curC=c;var bs=document.getElementsByClassName("c-btn");for(var i=0;i<bs.length;i++)bs[i].classList.remove("active");b.classList.add("active");render();}
function startFetch(nm){if(tmr)clearInterval(tmr);var sec=60;document.getElementById("reqSt").innerHTML="<h3 style='color:#15803d'>Scanning 6 Stores for '"+nm+"'...</h3><div class='p-wrap'><div class='p-bar' id='pB'></div></div><b id='tC' style='color:#dc2626'>60s remaining...</b>";tmr=setInterval(function(){sec--;if(document.getElementById("pB"))document.getElementById("pB").style.width=Math.round(((60-sec)/60)*100)+"%";if(document.getElementById("tC"))document.getElementById("tC").innerText=sec+"s remaining...";if(sec<=0){clearInterval(tmr);var b=85+(nm.length*8);var ni={n:nm+" (Live Pack)",c:"Grocery",o:"JUST ADDED",bs:1,d:b-4,r:b,s:b-2,w:b-3,b:b+6,z:b+5};db.unshift(ni);ext.unshift(ni);try{localStorage.setItem("surat_v11",JSON.stringify(ext));}catch(e){}render();}},1000);}
function render(){var q=document.getElementById("sBox").value.toLowerCase(),h="",cnt=0,stN=["D-Mart","Reliance","Star Bazaar","Wallet Mart","Blinkit","Zepto"];for(var i=0;i<db.length;i++){var x=db[i],okC=(curC==="All")||(curC==="Best"&&x.bs===1)||(curC==="Offer"&&x.o!=="")||(x.c===curC);if(okC&&x.n.toLowerCase().indexOf(q)!==-1){cnt++;var arr=[x.d,x.r,x.s,x.w,x.b,x.z],mn=Math.min.apply(null,arr),sh="";for(var j=0;j<6;j++){var isB=(arr[j]===mn);sh+="<div class='st "+(isB?"best":"")+"'>"+(isB?"<div class='b-lbl'>BEST</div>":"")+"<div>"+stN[j]+"</div><div><b>Rs."+arr[j]+"</b></div></div>";}var tg="<span class='tag'>"+x.c+"</span>"+(x.bs===1?"<span class='tag t-bs'>★ BEST SELLER</span>":"")+(x.o!==""?"<span class='tag t-off'>"+x.o+"</span>":"");h+="<div class='card'><div class='c-top'><div class='p-pic' style='background:#fef3c7'>🛍️<span>ITEM</span></div><div><span class='p-title'>"+x.n+"</span>"+tg+"</div></div><div class='grid'>"+sh+"</div></div>";}}document.getElementById("cBar").innerText="Showing "+cnt+" of "+db.length+" Surat items";if(h===""){var rq=document.getElementById("sBox").value;h="<div class='req-box' id='reqSt'><h3>'"+rq+"' not in list!</h3><button class='req-btn' onclick=\"startFetch('"+rq.replace(/'/g,"")+"')\">Fetch Live Price (1 Min)</button></div>";}document.getElementById("out").innerHTML=h;}
render();
</script>
</body>
</html>
