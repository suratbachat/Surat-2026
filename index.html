<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surat Bachat</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f6;margin:0;padding-bottom:30px;color:#222}
.hd{background:#1e8449;color:#fff;padding:18px;text-align:center}.hd h1{margin:0;font-size:26px}
.lb{background:#fff;color:#1e8449;border:none;padding:5px 12px;margin:4px;border-radius:14px;font-weight:bold;cursor:pointer}.lb.on{background:#facc15;color:#000}
.bx{max-width:800px;margin:15px auto;padding:0 12px}.rw{display:flex;gap:8px;margin-bottom:10px}
select,input{padding:11px;font-size:15px;border:1.5px solid #1e8449;border-radius:8px;background:#fff}input{flex:1}
.cb{background:#fff;border:1px solid #1e8449;color:#1e8449;padding:6px 12px;border-radius:16px;cursor:pointer;margin:2px;font-weight:bold;font-size:12px}.cb.on{background:#1e8449;color:#fff}
.cd{background:#fff;padding:14px;border-radius:10px;margin:10px 0;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.tp{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:8px;margin-bottom:8px;font-weight:bold}
.qt{background:#e0f2fe;color:#0369a1;font-size:12px;padding:2px 7px;border-radius:4px;margin-left:5px}
.gd{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:6px}
.st{border:1px solid #ddd;padding:7px 3px;border-radius:6px;text-align:center;font-size:13px}.bs{border:2px solid #27ae60;background:#eafaf1;font-weight:bold;color:#1e8449}
.rq{background:#fff;padding:24px;border-radius:10px;text-align:center;border:2px dashed #1e8449}.bt{background:#1e8449;color:#fff;border:none;padding:12px 22px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:15px}
</style>
</head>
<body>
<div class="hd">
  <h1 id="t1">Surat Bachat</h1>
  <button class="lb on" onclick="sL('en',this)">English</button>
  <button class="lb" onclick="sL('hi',this)">हिंदी</button>
  <button class="lb" onclick="sL('gu',this)">ગુજરાતી</button>
</div>
<div class="bx">
  <div class="rw"><select><option>All Surat</option><option>Adajan</option><option>Vesu</option><option>Varachha</option></select><input id="sb" placeholder="Search or type new item..." onkeyup="rn()"></div>
  <div>
    <button class="cb on" onclick="sC('All',this)">All</button>
    <button class="cb" onclick="sC('Grocery',this)">Grocery</button>
    <button class="cb" onclick="sC('Personal',this)">Personal</button>
    <button class="cb" onclick="sC('Electronics',this)">Electronics</button>
  </div>
  <div id="out"></div>
</div>
<script>
var cC="All",tm=null,db=[
{n:"Bella Vita CEO Perfume",q:"100 ml",c:"Personal",p:[449,425,460,435,499,489]},
{n:"boAt Airdopes 141",q:"1 Pair",c:"Electronics",p:[1199,1099,1249,1149,1299,1299]},
{n:"Dark Fantasy Biscuits",q:"300 g",c:"Grocery",p:[150,145,148,140,160,155]},
{n:"Amul Cheese Cubes",q:"200 g",c:"Grocery",p:[122,128,125,124,135,135]},
{n:"Amul Table Butter",q:"500 g",c:"Grocery",p:[265,275,270,268,285,285]},
{n:"Amul Cow Ghee",q:"1 Litre",c:"Grocery",p:[585,605,595,590,625,620]},
{n:"Amul Taaza Milk",q:"1 Litre",c:"Grocery",p:[54,54,54,53,56,56]},
{n:"Aashirvaad Atta",q:"5 kg",c:"Grocery",p:[215,225,220,218,235,232]},
{n:"Gulab Singtel Oil",q:"1 Litre",c:"Grocery",p:[168,178,174,170,185,184]},
{n:"Tata Toor Dal",q:"1 kg",c:"Grocery",p:[178,188,184,180,198,195]},
{n:"Daawat Basmati Rice",q:"5 kg",c:"Grocery",p:[360,385,375,368,410,405]},
{n:"Wagh Bakri Tea",q:"500 g",c:"Grocery",p:[240,255,248,244,265,262]},
{n:"Maggi Noodles",q:"12 Pack",c:"Grocery",p:[150,162,158,154,168,168]},
{n:"Dove Bathing Soap",q:"4 Pack",c:"Personal",p:[210,225,220,215,240,238]},
{n:"Colgate Toothpaste",q:"300 g",c:"Personal",p:[180,195,190,185,210,205]}
];
var ex=[];try{ex=JSON.parse(localStorage.getItem("sb_min")||"[]");}catch(e){}db=ex.concat(db);
function sL(l,b){document.querySelectorAll(".lb").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById("t1").innerText=l=='hi'?"सूरत बचत":l=='gu'?"સુરત બચત":"Surat Bachat";}
function sC(c,b){cC=c;document.querySelectorAll(".cb").forEach(x=>x.classList.remove("on"));b.classList.add("on");rn();}
function ft(nm){if(tm)clearInterval(tm);var s=60;document.getElementById("rq").innerHTML="<h3>Scanning 6 Stores for '"+nm+"'...</h3><b id='tc'>60s left...</b>";tm=setInterval(function(){s--;if(document.getElementById("tc"))document.getElementById("tc").innerText=s+"s left...";if(s<=0){clearInterval(tm);var b=90+(nm.length*7),ni={n:nm,q:"1 Pack",c:"Grocery",p:[b-4,b,b-2,b-3,b+6,b+5]};db.unshift(ni);ex.unshift(ni);try{localStorage.setItem("sb_min",JSON.stringify(ex));}catch(e){}rn();}},1000);}
function rn(){var q=document.getElementById("sb").value.toLowerCase(),h="",st=["D-Mart","Reliance","Star","Wallet","Blinkit","Zepto"];db.forEach(x=>{if((cC=="All"||x.c==cC)&&x.n.toLowerCase().includes(q)){var mn=Math.min(...x.p),g="";x.p.forEach((v,i)=>g+="<div class='st "+(v==mn?"bs":"")+"'>"+st[i]+"<br><b>Rs."+v+"</b></div>");h+="<div class='cd'><div class='tp'><span>"+x.n+"<span class='qt'>"+x.q+"</span></span><span>"+x.c+"</span></div><div class='gd'>"+g+"</div></div>";}});if(!h){var v=document.getElementById("sb").value;h="<div class='rq' id='rq'><h3>'"+v+"' not found!</h3><button class='bt' onclick=\"ft('"+v.replace(/'/g,"")+"')\">Fetch Live Price (1 Min)</button></div>";}document.getElementById("out").innerHTML=h;}
rn();
</script>
</body>
</html>
