<!DOCTYPE html>

<title>Surat Bachat</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f6;margin:0;padding:0 0 40px;color:#222}
.header{background:#1e8449;color:#fff;padding:18px 15px;text-align:center}
.header h1{margin:0;font-size:28px}.header p{margin:5px 0 10px;font-size:14px}
.lang-btn{background:#fff;color:#1e8449;border:none;padding:6px 14px;margin:3px;border-radius:15px;font-weight:bold;cursor:pointer}
.lang-btn.active{background:#facc15;color:#000}
.box{max-width:850px;margin:16px auto;padding:0 15px}
.rhyme-bar{background:linear-gradient(90deg,#fef3c7,#fde68a);border:2px dashed #d97706;color:#92400e;padding:12px 16px;border-radius:12px;margin-bottom:14px;text-align:center;font-weight:bold;font-size:16px;cursor:pointer}
.row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
select,input{padding:13px;font-size:16px;border:1.5px solid #1e8449;border-radius:8px;background:#fff}
input{flex:1;min-width:220px}
.cats{margin-bottom:15px}
.cat-btn{background:#fff;border:1px solid #1e8449;color:#1e8449;padding:8px 14px;border-radius:20px;cursor:pointer;margin:3px;font-weight:bold;font-size:13px}
.cat-btn.active{background:#1e8449;color:#fff}
.count-bar{font-size:14px;color:#444;margin-bottom:10px;font-weight:bold}
.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.c-top{display:flex;align-items:center;gap:14px;border-bottom:1px solid #eee;padding-bottom:12px;margin-bottom:12px}
.p-img{width:76px;height:76px;border-radius:10px;border:1px solid #d1fae5;background:#fff;padding:4px;flex-shrink:0;overflow:hidden}
.p-img img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.p-title{font-size:17px;font-weight:bold;color:#111;display:block;margin-bottom:5px}
.qty{background:#e0f2fe;color:#0369a1;font-size:12px;padding:3px 8px;border-radius:5px;font-weight:bold;margin-right:5px;display:inline-block}
.tag{font-size:11px;padding:3px 8px;border-radius:5px;font-weight:bold;background:#e8f8f5;color:#1e8449;margin-right:4px;display:inline-block}
.t-off{background:#fdebd0;color:#d35400}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.st{border:1px solid #ddd;padding:9px 4px;border-radius:8px;text-align:center;background:#fafafa;font-size:14px}
.best{border:2px solid #27ae60;background:#eafaf1;font-weight:bold;color:#1e8449}
.b-lbl{background:#27ae60;color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;display:inline-block;margin-bottom:2px}
.req-box{background:#fff;padding:30px 20px;border-radius:12px;text-align:center;border:2px dashed #1e8449}
.req-btn{background:#1e8449;color:#fff;border:none;padding:14px 26px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:17px;margin-top:10px}
.prog-wrap{width:100%;max-width:380px;height:14px;background:#e8f8f5;border-radius:10px;margin:14px auto;overflow:hidden;border:1px solid #1e8449}
.prog-bar{height:100%;width:0%;background:#1e8449;transition:width 1s linear}
</style>
</head>
