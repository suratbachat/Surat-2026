<!DOCTYPE html>

<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6f4;margin:0;padding:0 0 40px;color:#222;overflow-x:hidden}
.top-red{background:#dc2626;color:#fff;padding:10px;text-align:center;font-weight:bold;font-size:13px;position:sticky;top:0;z-index:300}
.left-doodle{position:fixed;top:38px;bottom:0;left:0;width:215px;background:linear-gradient(180deg,#fffbeb,#fef3c7,#fde68a);border-right:4px dashed #dc2626;padding:8px;z-index:200;display:flex;flex-direction:column;text-align:center;cursor:pointer;animation:glow 1.4s infinite alternate}
@keyframes glow{0%{border-color:#dc2626}100%{border-color:#15803d}}
.d-frame{border:3px dotted #f59e0b;border-radius:16px;background:#fff;padding:10px 8px;flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.d-badge{background:#dc2626;color:#fff;font-size:11px;font-weight:900;padding:4px 10px;border-radius:12px}
.d-bigpic{width:170px;height:190px;border-radius:14px;border:3px solid #fbbf24;background:linear-gradient(145deg,#111827,#1f2937);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;box-shadow:0 8px 18px rgba(0,0,0,0.22)}
.d-bigpic .ico{font-size:78px;line-height:1}
.d-bigpic b{color:#fbbf24;font-size:13px;margin-top:8px;letter-spacing:1px}
.d-catchy{font-size:16px;font-weight:900;color:#b91c1c;line-height:1.25;text-transform:uppercase}
.d-price{background:#15803d;color:#fff;font-size:12px;font-weight:bold;padding:7px;border-radius:8px;width:100%}
.right-rail{position:fixed;top:38px;bottom:0;right:0;width:78px;background:linear-gradient(180deg,#dcfce7,#fef9c3,#fee2e2);border-left:4px solid #15803d;overflow:hidden;z-index:200}
.rail-track{display:flex;flex-direction:column;gap:10px;padding:10px 8px;animation:moveUp 14s linear infinite}
.rail-box{width:58px;height:58px;background:#fff;border-radius:12px;border:2px solid #f59e0b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px}
.rail-box span{font-size:8px;color:#111;font-weight:bold;margin-top:2px}
@keyframes moveUp{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.main{margin:14px 88px 14px 225px}
.lang-bar{display:flex;justify-content:space-between;align-items:center;background:#15803d;color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.lang-bar h2{margin:0;font-size:18px}
.l-btn{background:#fff;color:#15803d;border:none;padding:5px 11px;border-radius:14px;font-weight:bold;cursor:pointer;font-size:12px}
.l-btn.active{background:#facc15;color:#000}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
select,input{padding:11px;font-size:14px;border:2px solid #15803d;border-radius:10px;background:#fff}
input{flex:1;min-width:160px;font-weight:bold}
.cats{margin-bottom:10px}
.c-btn{background:#fff;border:1.5px solid #15803d;color:#15803d;padding:6px 12px;border-radius:18px;cursor:pointer;margin:2px;font-weight:bold;font-size:12px}
.c-btn.active{background:#15803d;color:#fff}
.c-bar{font-size:13px;color:#374151;margin-bottom:10px;font-weight:bold}
.card{background:#fff;padding:14px;border-radius:14px;margin-bottom:14px;box-shadow:0 3px 8px rgba(0,0,0,0.07);border:1px solid #e5e7eb}
.c-top{display:flex;align-items:center;gap:12px;border-bottom:1px solid #f3f4f6;padding-bottom:10px;margin-bottom:10px}
.p-pic{width:68px;height:68px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:2px solid #bbf7d0;font-size:32px}
.p-pic span{font-size:8px;font-weight:bold;color:#111;margin-top:2px}
.p-title{font-size:16px;font-weight:bold;display:block;margin-bottom:4px;color:#111}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:bold;background:#dcfce7;color:#15803d;margin-right:4px;display:inline-block}
.t-off{background:#fee2e2;color:#dc2626}.t-bs{background:#fef08a;color:#854d0e;border:1px solid #eab308}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:6px}
.st{border:1px solid #e5e7eb;padding:7px 3px;border-radius:8px;text-align:center;background:#f9fafb;font-size:12px}
.best{border:2px solid #16a34a;background:#ecfdf5;font-weight:bold;color:#15803d}
.b-lbl{background:#16a34a;color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;display:inline-block;margin-bottom:2px}
.req-box{background:#fff;padding:22px;border-radius:14px;text-align:center;border:2px dashed #15803d}
.req-btn{background:#15803d;color:#fff;border:none;padding:11px 20px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px;margin-top:8px}

@media(max-width:700px){.left-doodle{width:120px;padding:4px}.d-bigpic{width:96px;height:110px}.d-bigpic .ico{font-size:46px}.d-catchy{font-size:11px}.right-rail{width:48px}.rail-box{width:36px;height:36px;font-size:16px}.main{margin:10px 52px 10px 124px}}
</style>
</head>
