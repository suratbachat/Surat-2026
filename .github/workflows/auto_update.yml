name: Daily Live Scraper & Price Sync

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Safe Scraper Tools
        run: pip install requests beautifulsoup4

      - name: Run Surat Live Price Scraper
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scraper.py

      - name: Save Updated Catalog
        run: |
          git config --local user.email "bot@suratbachat.com"
          git config --local user.name "Surat Bachat Bot"
          git add products.json
          git commit -m "Auto-synced live Surat store prices" || exit 0
          git push
