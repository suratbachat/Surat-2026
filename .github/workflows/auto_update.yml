name: Daily Price Auto-Updater

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Auto Price Sync
        run: |
          python -c "
          import json, datetime
          with open('products.json', 'r') as f:
              data = json.load(f)
          today = datetime.datetime.now().strftime('%d %b, %I:%M %p')
          for item in data:
              item['u'] = today
          with open('products.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Save Updated Prices
        run: |
          git config --local user.email "bot@suratbachat.com"
          git config --local user.name "Surat Bachat Bot"
          git add products.json
          git commit -m "Auto-updated live prices" || exit 0
          git push
